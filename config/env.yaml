name: traffic-sign-recon-gr7
channels:
  - pytorch
  - conda-forge
  - defaults
  - nvidia

dependencies:
  # Core Python and Jupyter
  - python=3.10
  - jupyter
  - jupyterlab
  - notebook
  - ipywidgets
  - ipykernel
  
  # PyTorch ecosystem
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  
  # Scientific computing
  - numpy
  - scipy
  - pandas
  - scikit-learn
  
  # Visualization
  - matplotlib
  - seaborn
  - plotly
  - tensorboard
  
  # Image processing
  - pillow
  - opencv
  
  # Progress bars and utilities
  - tqdm
  - pyyaml
  
  # Development tools
  - ipython
  
  # Additional ML tools
  - wandb  
  - torchmetrics
  - tensorboard
  
  - pip
